name: build-and-test
on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Load configuration
        run: |
          source .github/config.env
          echo "ZIG_VERSION=${ZIG_VERSION}" >> $GITHUB_ENV
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build
      - run: zig build test
